# --- PRODUCTION STUDIO ---
server {
    listen 80;
    server_name studio.lesgriotsxstudio.com;

    root /var/www/ecosystem/productuction/current/studio/dist;
    index index.html;

    include /etc/nginx/mime.types;
    types {
        application/javascript mjs;
    }

    location / {
        # SPA Fallback
        try_files $uri $uri/ /index.html;
    }
}

# --- STAGING STUDIO ---
server {
    listen 80;
    server_name staging.studio.lesgriotsxstudio.com;

    root /var/www/ecosystem/staging/current/studio/dist;
    index index.html;

    include /etc/nginx/mime.types;
    types {
        application/javascript mjs;
    }

    location / {
        # SPA Fallback
        try_files $uri $uri/ /index.html;
    }
}
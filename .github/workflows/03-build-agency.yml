name: "🏗️ Build: Agency (VPS)"
on:
    workflow_call:

jobs:
    deploy-vps:
        runs-on: ubuntu-latest
        environment: ${{ startsWith(github.ref_name, 'staging-') && 'staging' || 'production' }}
        steps:
            - name: 🏗️ Prepare and Build Agency
              uses: appleboy/ssh-action@master
              with:
                  host: ${{ secrets.VPS_HOST }}
                  username: ${{ secrets.VPS_USERNAME }}
                  key: ${{ secrets.VPS_SSH_KEY }}
                  script: |
                      set -e

                      ENVIRONMENT=${{ startsWith(github.ref_name, 'staging-') && 'staging' || 'production' }}
                      TAG_NAME="${{ github.ref_name }}"
                      RELEASE_DIR="/var/www/ecosystem/$ENVIRONMENT/releases/release-$TAG_NAME"

                      echo "=========================================="
                      echo "🏗️ BUILDING AGENCY: $TAG_NAME"
                      echo "=========================================="

                      cd $RELEASE_DIR/agency

                      echo "📝 Injecting Environment Variables (.env)..."
                      echo "NUXT_SANITY_AGENCY_PROJECT_ID=${{ secrets.SANITY_AGENCY_PROJECT_ID }}" >> .env
                      echo "NUXT_SANITY_AGENCY_DATASET=${{ secrets.SANITY_AGENCY_DATASET }}" >> .env
                      echo "NUXT_SANITY_AGENCY_API_VERSION=${{ secrets.SANITY_AGENCY_API_VERSION }}" >> .env
                      echo "NUXT_SANITY_AGENCY_STUDIO_APP_ID=${{ secrets.SANITY_AGENCY_STUDIO_APP_ID }}" >> .env
                      echo "NUXT_SANITY_REVALIDATE_SECRET=${{ secrets.SANITY_REVALIDATE_SECRET }}" >> .env
                      echo "NUXT_NITRO_CACHE_DIR=${{ secrets.AGENCY_NITRO_CACHE_DIR }}" >> .env
                      echo "NUXT_DEPLOY_SECRET=${{ secrets.DEPLOY_SECRET }}" >> .env
                      echo "${{ secrets.DEPLOY_SECRET }}"
                      echo "NUXT_BASE_URL=${{ secrets.AGENCY_BASE_URL }}" >> .env
                      echo "NUXT_CLOUDFLARE_CACHE_PURGE_TOKEN=${{ secrets.CLOUDFLARE_CACHE_PURGE_TOKEN }}" >> .env
                      echo "NUXT_CLOUDFLARE_ZONE_ID=${{ secrets.CLOUDFLARE_ZONE_ID }}" >> .env

                      # echo "📝 Injecting Environment Variables in shell..."
                      # export NUXT_SANITY_AGENCY_PROJECT_ID=${{ secrets.SANITY_AGENCY_PROJECT_ID }}
                      # export NUXT_SANITY_AGENCY_DATASET=${{ secrets.SANITY_AGENCY_DATASET }}
                      # export NUXT_SANITY_AGENCY_API_VERSION=${{ secrets.SANITY_AGENCY_API_VERSION }}
                      # export NUXT_SANITY_AGENCY_STUDIO_APP_ID=${{ secrets.SANITY_AGENCY_STUDIO_APP_ID }}
                      # export NUXT_SANITY_REVALIDATE_SECRET=${{ secrets.SANITY_REVALIDATE_SECRET }}
                      # export NUXT_NITRO_CACHE_DIR=${{ secrets.AGENCY_NITRO_CACHE_DIR }}
                      # export NUXT_DEPLOY_SECRET=${{ secrets.DEPLOY_SECRET }}
                      # export NUXT_BASE_URL=${{ secrets.AGENCY_BASE_URL }}
                      # export NUXT_CLOUDFLARE_CACHE_PURGE_TOKEN=${{ secrets.CLOUDFLARE_CACHE_PURGE_TOKEN }}
                      # export NUXT_CLOUDFLARE_ZONE_ID=${{ secrets.CLOUDFLARE_ZONE_ID }}

                      echo "📦 Running npm ci (Agency)..."
                      npm ci --legacy-peer-deps

                      echo "🔨 Running Nuxt Build..."
                      npm run build

                      echo "✅ Agency Build Complete!"

name: "🚀 Deploy & Cleanup"
on:
    workflow_call:

jobs:
    post-deployment:
        runs-on: ubuntu-latest
        environment: ${{ startsWith(github.ref_name, 'staging-') && 'staging' || 'production' }}
        steps:
            - name: 🔄 Atomic Swap, Restart & Cleanup
              uses: appleboy/ssh-action@master
              with:
                  host: ${{ secrets.VPS_HOST }}
                  username: ${{ secrets.VPS_USERNAME }}
                  key: ${{ secrets.VPS_SSH_KEY }}
                  script: |
                      set -e

                      ENVIRONMENT=${{ startsWith(github.ref_name, 'staging-') && 'staging' || 'production' }}
                      RELEASE_HISTORY_COUNT=${{ startsWith(github.ref_name, 'staging-') && '1' || '5' }}
                      TAG_NAME="${{ github.ref_name }}"
                      RELEASE_DIR="/var/www/ecosystem/$ENVIRONMENT/releases/release-$TAG_NAME"
                      LIVE_LINK="/var/www/ecosystem/$ENVIRONMENT/current"

                      echo "=========================================="
                      echo "🚀 EXECUTING ATOMIC DEPLOYMENT"
                      echo "=========================================="

                      # --- Atomic Symlink Swap ---
                      echo "🔗 Swapping symlink to: release-$TAG_NAME"
                      ln -sfn $RELEASE_DIR $LIVE_LINK

                      # --- Restart PM2 (Agency) ---
                      echo "🔄 Reloading Node.js via PM2..."
                      pm2 reload $LIVE_LINK/ops/pm2/ecosystem.config.cjs --only agency-$ENVIRONMENT --update-env

                      # --- Save the PM2 state to ~/.pm2/dump.pm2 ---
                      echo "💾 Saving PM2 state..."
                      pm2 save

                      echo "=========================================="
                      echo "🎉 DEPLOYMENT SUCCESSFUL: $TAG_NAME"
                      echo "=========================================="

                      # --- Cleanup Old Releases ---
                      echo "🧹 Cleaning up old releases (Keeping last 5)..."
                      cd /var/www/ecosystem/$ENVIRONMENT/releases
                      ls -t | tail -n +$RELEASE_HISTORY_COUNT | xargs -r rm -rf
                      echo "✅ Cleanup complete."

                      # --- Remove .env from apps ---
                      rm -rf $LIVE_LINK/agency/.env

                      # --- Trigger ISR Cache Wipe ---
                      echo "🌐 Pinging Nuxt to wipe ISR cache..."
                      curl -f -sS -X POST "${{ secrets.AGENCY_BASE_URL }}/api/revalidate" -H "Authorization: Bearer ${{ secrets.DEPLOY_SECRET }}"

                      echo "✅ ISR Synchronization Initiated."
